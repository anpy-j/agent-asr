[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-asr"
version = "0.1.1"
description = "Independent local speech transcription runtime for desktop apps and MCP agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["av>=16,<19", "psutil>=6,<8", "rapidfuzz>=3.9,<4"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.2,<2"]
r2t2 = ["qwen-asr==0.0.6", "torch>=2.6,<3", "gradio>=5,<6"]
mcp = ["mcp>=1.12,<2"]
dev = ["pytest>=8,<10", "build>=1.2,<2", "ruff>=0.12,<1"]

[project.scripts]
agent-asr = "agent_asr.cli:main"

[project.urls]
Repository = "https://github.com/anpy-j/agent-asr"
Issues = "https://github.com/anpy-j/agent-asr/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
